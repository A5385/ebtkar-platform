packages:
    - 'src/packages/*'
    - 'src/web/*'
    - 'src/api/*'
    - 'src/database/*'
allowBuilds:
    unrs-resolver: true
    esbuild: false
    '@swc/core': false
    '@nestjs/core': false
    '@parcel/watcher': true
    less: true
    nx: true
    '@prisma/engines': true
    prisma: true
    '@prisma/client': true

catalog:
    # Nx
    nx: 23.1.2
    '@nx-tools/nx-prisma': ^7.3.0
    '@nx/devkit': 23.1.2
    '@nx/eslint': 23.1.2
    '@nx/eslint-plugin': 23.1.2
    '@nx/jest': 23.1.2
    '@nx/js': 23.1.2
    '@nx/nest': 23.1.2
    '@nx/node': 23.1.2
    '@nx/playwright': 23.1.2
    '@nx/react': 23.1.2
    '@nx/vite': 23.1.2
    '@nx/vitest': 23.1.2
    '@nx/web': 23.1.2
    '@nx/webpack': 23.1.2
    # TypeScript
    typescript: 6.0.3
    typescript-eslint: 8.68.0
    tslib: 2.8.1
    ts-node: 10.9.2
    tsx: ^4.23.12
    # ESLint and formatting
    '@eslint/js': 9.39.5
    eslint: 9.39.5
    eslint-config-prettier: 10.1.8
    eslint-plugin-import: 2.32.0
    eslint-plugin-jsx-a11y: 6.10.2
    eslint-plugin-playwright: 2.11.0
    eslint-plugin-react: 7.37.5
    eslint-plugin-react-hooks: 7.1.1
    jsonc-eslint-parser: 3.3.0
    prettier: 3.9.6
    # SWC
    '@swc-node/register': 1.12.1
    '@swc/cli': ~0.8.1
    '@swc/core': 1.16.1
    '@swc/helpers': 0.5.23
    '@swc/jest': 0.2.39
    # React
    react: 19.2.8
    react-dom: 19.2.8
    '@types/react': 19.2.18
    '@types/react-dom': 19.2.5
    # Vite
    vite: 8.2.2
    '@vitejs/plugin-react': 6.1.0
    '@tailwindcss/vite': ^4.3.3
    vite-plugin-dts: 5.0.3
    # Vitest
    vitest: 4.1.11
    '@vitest/coverage-v8': 4.1.11
    '@vitest/ui': 4.1.11
    jsdom: 30.0.1
    # Jest
    jest: 30.4.2
    jest-environment-node: 30.4.1
    jest-util: 30.4.1
    ts-jest: 29.4.12
    '@types/jest': ~30.0.0
    # Testing
    '@testing-library/dom': 10.4.1
    '@testing-library/react': 16.3.2
    '@playwright/test': 1.62.1
    # NestJS
    '@nestjs/common': 12.0.1
    '@nestjs/core': 12.0.1
    '@nestjs/platform-express': 12.0.1
    '@nestjs/schematics': 12.0.0
    '@nestjs/testing': 12.0.1
    reflect-metadata: 0.2.2
    rxjs: 7.8.2
    # Prisma and PostgreSQL
    prisma: ^7.10.0
    '@prisma/client': 7.10.0
    '@prisma/adapter-pg': 7.10.0
    pg: 8.23.0
    '@types/pg': ^8.23.1
    zod-prisma-types: ^3.3.11
