    dotenv: ^17.4.2
    # Web UI / shadcn
    '@base-ui/react': ^1.7.0
    '@fontsource-variable/geist': ^5.3.0
    '@shadcn/react': ^0.3.0
    class-variance-authority: ^0.7.1
    clsx: ^2.1.1
    cmdk: ^1.1.1
