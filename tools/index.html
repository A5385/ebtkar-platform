<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>${title}</title>
    </head>

    <body
        style="
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            font-family: Arial, Helvetica, sans-serif;
        "
    >
        <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            border="0"
            style="background-color: #f4f4f4; padding: 30px 15px"
        >
            <tr>
                <td align="center">
                    <table
                        role="presentation"
                        width="100%"
                        cellpadding="0"
                        cellspacing="0"
                        border="0"
                        style="max-width: 480px; background-color: #ffffff; border-radius: 8px"
                    >
                        <tr>
                            <td align="center" style="padding: 40px 30px">
                                <h1
                                    style="
                                        margin: 0 0 20px;
                                        font-size: 26px;
                                        font-weight: 600;
                                        color: #2563eb;
                                    "
                                >
                                    ${title}
                                </h1>

                                <p
                                    style="
                                        margin: 0 0 24px;
                                        font-size: 16px;
                                        line-height: 24px;
                                        color: #444444;
                                    "
                                >
                                    ${message}
                                </p>

                                <table
                                    role="presentation"
                                    cellpadding="0"
                                    cellspacing="0"
                                    border="0"
                                >
                                    <tr>
                                        <td
                                            align="center"
                                            style="
                                                background-color: #2563eb;
                                                border-radius: 6px;
                                                padding: 12px 24px;
                                            "
                                        >
                                            <span
                                                style="
                                                    color: #ffffff;
                                                    font-size: 28px;
                                                    font-weight: bold;
                                                    letter-spacing: 6px;
                                                "
                                            >
                                                ${otp}
                                            </span>
                                        </td>
                                    </tr>
                                </table>

                                <p
                                    style="
                                        margin: 24px 0 0;
                                        font-size: 13px;
                                        line-height: 20px;
                                        color: #777777;
                                    "
                                >
                                    If you did not request this code, you can safely ignore this
                                    email.
                                </p>

                                <p style="margin: 8px 0 0; font-size: 13px; color: #777777">
                                    Do not share this verification code with anyone.
                                </p>
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>
        </table>
    </body>
</html>
